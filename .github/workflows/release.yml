name: Release
# Reusable release for the opendeck-* plugin repos. The caller triggers it on
# `push: tags: ["v*"]` and calls
# `jfms7s/opendeck-plugin-ci/.github/workflows/release.yml@<sha>` (see README.md).
#
# The tagged commit is verified (tag = Cargo.toml = manifest.json version, fmt,
# clippy, tests, PI tests, advisory scan), built (Linux on Ubuntu, the Apple
# Silicon binary on a macOS runner, each started once), packaged by build.mjs
# into <bin>.streamDeckPlugin with SHA256SUMS, attested, and attached to a
# *draft* GitHub release. Nothing here publishes it: the owner runs the README's
# smoke checklist on the draft and publishes by hand. A release is never
# visible without its asset, and the only job with a write token runs no
# project code.
#
# Jobs (a caller job named `release` reports them as `release / <job>`):
#   verify -> build-linux, build-macos -> package -> publish
on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain (keep it equal to the caller's CI).
        type: string
        default: "1.98.1"
      node-version:
        type: string
        default: "24"
      node-version-file:
        description: A version file (e.g. .nvmrc) to use instead of node-version.
        type: string
        default: ""
      apt-packages:
        description: Space-separated apt packages for the verify job (e.g. dbus-daemon).
        type: string
        default: ""
      pi-tests:
        description: Glob of the property-inspector tests run in verify. Empty means none.
        type: string
        default: ""
      audit:
        description: "Advisory scan before building: `cargo-audit`, `cargo-deny` or empty for none."
        type: string
        default: ""
      cargo-audit-version:
        type: string
        default: "0.22.2"
      deny-checks:
        type: string
        default: advisories
      macos:
        description: Build and bundle the aarch64-apple-darwin binary (it must be in the manifest's CodePaths).
        type: boolean
        default: true
      macos-runner:
        type: string
        default: macos-15
      macos-test:
        description: Run `cargo test` natively on macOS before building.
        type: boolean
        default: false
      check-macos:
        description: "Command run on the native macOS binary (template {bin}): signature, arm64, start-up."
        type: string
        default: ""
      aarch64-linux:
        description: Cross-build the aarch64 Linux binary (it must be in the manifest's CodePaths).
        type: boolean
        default: false
      check-x86_64:
        description: "Command run on the x86_64 Linux binary (template {bin}); empty skips it."
        type: string
        default: ""
      check-aarch64:
        description: "Command run on the aarch64 Linux binary under qemu (template {bin}); empty skips it."
        type: string
        default: ""
      release-notes:
        description: Use scripts/release-body.mjs (the README smoke checklist) as the draft's notes.
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
      - name: Tag matches the Cargo and manifest versions
        run: node build.mjs --check-only --tag "$GITHUB_REF_NAME"
      - if: inputs.apt-packages != ''
        name: Install apt packages
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          # shellcheck disable=SC2086 # a list of packages on purpose
          sudo apt-get update && sudo apt-get install -y $PACKAGES
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - if: inputs.pi-tests != ''
        name: Property inspector tests
        env:
          TESTS: ${{ inputs.pi-tests }}
        run: |
          # shellcheck disable=SC2086 # the glob is expanded by the shell on purpose
          node --test $TESTS
      # A tag can point at a commit that never ran CI: no draft from a
      # lockfile with a known advisory.
      - if: inputs.audit == 'cargo-audit'
        env:
          VERSION: ${{ inputs.cargo-audit-version }}
        run: cargo install cargo-audit --locked --version "$VERSION"
      - if: inputs.audit == 'cargo-audit'
        run: cargo audit
      - if: inputs.audit == 'cargo-deny'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check ${{ inputs.deny-checks }}

  # Native Apple Silicon build. Read-only, like build-linux: it runs every
  # dependency's build script. No build cache: a poisoned PR cache must never
  # reach a release build.
  build-macos:
    if: inputs.macos
    needs: verify
    runs-on: ${{ inputs.macos-runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The [package] name is the first `name =` line in Cargo.toml.
      - name: Binary name from Cargo.toml
        run: echo "BIN=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: aarch64-apple-darwin
      # The macOS-only code is tested natively here: the tag's commit may
      # never have passed CI's `macos` job.
      - if: inputs.macos-test
        run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - if: inputs.check-macos != ''
        name: Check it is a signed arm64 binary that starts
        env:
          CHECK: ${{ inputs.check-macos }}
        run: bash -euo pipefail -c "${CHECK//\{bin\}/target/aarch64-apple-darwin/release/$BIN}"
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release "$BIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  # Read-only: this job runs every dependency's build script and proc macro,
  # so it gets no token that can write anything.
  build-linux:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The [package] name is the first `name =` line in Cargo.toml.
      - name: Binary name from Cargo.toml
        run: echo "BIN=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: ${{ inputs.aarch64-linux && 'x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      - if: inputs.aarch64-linux
        name: Install the aarch64 linker and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - if: inputs.aarch64-linux
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - if: inputs.check-x86_64 != ''
        name: Start the x86_64 binary
        env:
          CHECK: ${{ inputs.check-x86_64 }}
        run: bash -euo pipefail -c "${CHECK//\{bin\}/target/x86_64-unknown-linux-gnu/release/$BIN}"
      - if: inputs.aarch64-linux && inputs.check-aarch64 != ''
        name: Start the aarch64 binary under qemu (it links and runs)
        env:
          CHECK: ${{ inputs.check-aarch64 }}
        run: bash -euo pipefail -c "${CHECK//\{bin\}/target/aarch64-unknown-linux-gnu/release/$BIN}"
      # Nothing may ship that is not the architecture it is named for.
      - name: Check each binary's architecture
        run: |
          file -b "target/x86_64-unknown-linux-gnu/release/$BIN" | grep -q 'x86-64'
          if [ "${{ inputs.aarch64-linux }}" = true ]; then
            file -b "target/aarch64-unknown-linux-gnu/release/$BIN" | grep -q 'ARM aarch64'
          fi
      - name: Pack the Linux binaries (a tar keeps the executable bit; artifacts don't)
        run: |
          set -- "x86_64-unknown-linux-gnu/release/$BIN"
          if [ "${{ inputs.aarch64-linux }}" = true ]; then
            set -- "$@" "aarch64-unknown-linux-gnu/release/$BIN"
          fi
          tar -cf linux-bins.tar -C target "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-bins
          path: linux-bins.tar
          if-no-files-found: error

  # Assembles the bundle from the builds. No write access, no cargo.
  package:
    needs: [build-linux, build-macos]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-macos.result) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
      - name: Binary name from Cargo.toml
        run: echo "BIN=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-bins
      - if: inputs.macos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bin
      - name: Unpack the Linux binaries where build.mjs looks for them
        run: |
          mkdir -p target
          tar -xf linux-bins.tar -C target
          test -x "target/x86_64-unknown-linux-gnu/release/$BIN"
      - if: inputs.macos
        name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          test -x "target/aarch64-apple-darwin/release/$BIN"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "target/aarch64-apple-darwin/release/$BIN" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
      # --release: every CodePaths binary must be in the bundle, and
      # dist/<bin>.streamDeckPlugin and dist/SHA256SUMS are written.
      - name: Assemble the bundle (every target in the manifest's CodePaths)
        run: node build.mjs --release --tag "$GITHUB_REF_NAME"
      - name: Every binary in the bundle is executable
        run: |
          for file in $(jq -r '.CodePaths[]' assets/manifest.json); do
            unzip -Z "dist/$BIN.streamDeckPlugin" | grep -E "^-rwx.*/$file\$"
          done
      - run: cat dist/SHA256SUMS
      # Written after the bundle is zipped and checksummed, so it is in
      # neither; it only becomes the draft's notes.
      - if: inputs.release-notes
        name: Write the draft's notes (the README smoke checklist, unticked)
        run: node scripts/release-body.mjs > dist/RELEASE_BODY.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
            dist/RELEASE_BODY.md
          if-no-files-found: error

  # The only job with write access. It runs no project or dependency code: it
  # attests and attaches what `package` produced, as a draft the owner publishes.
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Check the bundle against its checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      # Signed by GitHub, outside the release's assets: whoever could swap the
      # bundle could swap SHA256SUMS, but not this.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.streamDeckPlugin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          # Left as a draft for the owner's smoke run; never published here.
          draft: true
          # GitHub puts the generated change list after this body.
          body_path: ${{ inputs.release-notes && 'dist/RELEASE_BODY.md' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
